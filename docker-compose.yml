version: '3.8'

services:
  vaultline:
    build: .
    image: vaultline:latest
    container_name: vaultline-app
    ports:
      - "3002:3000"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000

  jenkins:
    image: jenkins/jenkins:lts-jdk17
    container_name: vaultline-jenkins
    user: root
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  sonarqube:
    image: sonarqube:lts-community
    container_name: vaultline-sonarqube
    ports:
      - "9000:9000"
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    volumes:
      - sonarqube_data:/opt/sonarqube/data
    restart: unless-stopped

volumes:
  jenkins_data:
  sonarqube_data:
