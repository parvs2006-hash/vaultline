# EduTrack Application Properties
spring.application.name=EduTrack
server.port=8080

# 30-minute inactivity session timeout
server.servlet.session.timeout=30m

# File upload configuration for CSV import
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Thymeleaf cache (false for live template development)
spring.thymeleaf.cache=false

# Logging format
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.level.com.edutrack=INFO
