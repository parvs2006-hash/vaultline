<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>First-Time Setup | EduTrack</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body style="justify-content: center; align-items: center; background: linear-gradient(135deg, #1e3a8a 0%, #0f172a 100%);">
    
    <div style="width: 100%; max-width: 480px; padding: 1.5rem;">
        <div class="card" style="box-shadow: var(--shadow-lg); border-radius: var(--radius-lg); padding: 2.25rem;">
            
            <div style="text-align: center; margin-bottom: 1.75rem;">
                <div class="nav-brand-logo" style="width: 52px; height: 52px; font-size: 1.75rem; margin: 0 auto 0.75rem auto;">🎓</div>
                <h1 style="font-size: 1.6rem; color: var(--primary);">EduTrack Setup</h1>
                <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.35rem;">
                    Welcome! Initialize your institution's first Faculty Administrator account.
                </p>
                <div style="margin-top: 0.5rem; display: inline-block; font-size: 0.75rem; background: var(--secondary-light); color: var(--secondary); padding: 2px 10px; border-radius: 9999px; font-weight: 600;">
                    UN SDG 4: Quality Education
                </div>
            </div>

            <!-- Error message if any -->
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <form th:action="@{/setup}" method="post">
                <div class="form-group">
                    <label class="form-label">Full Name</label>
                    <input type="text" name="name" class="form-control" placeholder="e.g. Prof. Rajesh Sharma" required autofocus>
                </div>

                <div class="form-group">
                    <label class="form-label">Official Email Address</label>
                    <input type="email" name="email" class="form-control" placeholder="teacher@college.edu" required>
                    <small style="color: var(--text-muted); font-size: 0.8rem;">This email will be your login username.</small>
                </div>

                <div class="form-group">
                    <label class="form-label">Password</label>
                    <div style="display:flex; gap:0.5rem;">
                        <input type="password" id="setup-pass" name="password" class="form-control" placeholder="Min. 6 characters" required>
                        <button type="button" class="btn btn-outline btn-sm" onclick="togglePasswordVisibility('setup-pass', this)">👁️ Show</button>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Confirm Password</label>
                    <input type="password" id="setup-conf-pass" name="confirmPassword" class="form-control" placeholder="Re-enter password" required>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem; font-size: 1rem; margin-top: 0.5rem;">
                    Complete Setup &amp; Create Account
                </button>
            </form>

            <div style="margin-top: 1.5rem; text-align: center; border-top: 1px solid var(--border-color); padding-top: 1rem;">
                <p style="font-size: 0.8rem; color: var(--text-muted);">
                    Shah &amp; Anchor Kutchhi Engineering College &bull; Java Fundamentals
                </p>
            </div>
        </div>
    </div>

    <script th:src="@{/js/main.js}"></script>
</body>
</html>
