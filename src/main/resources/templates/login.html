<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | EduTrack</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .role-switch-container {
            display: flex;
            background: var(--bg-subtle);
            padding: 4px;
            border-radius: var(--radius-sm);
            margin-bottom: 1.5rem;
            border: 1px solid var(--border-color);
        }
        .role-btn {
            flex: 1;
            padding: 8px 12px;
            border: none;
            background: transparent;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-secondary);
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .role-btn.active {
            background: var(--bg-surface);
            color: var(--primary);
            box-shadow: var(--shadow-sm);
        }
    </style>
</head>
<body style="min-height: 100vh; justify-content: center; align-items: center; background: linear-gradient(135deg, #1e3a8a 0%, #0f172a 100%);">

    <div style="width: 100%; max-width: 440px; padding: 1.5rem;">
        <div class="card" style="box-shadow: var(--shadow-lg); border-radius: var(--radius-lg); padding: 2.25rem;">
            
            <div style="text-align: center; margin-bottom: 1.5rem;">
                <div class="nav-brand-logo" style="width: 48px; height: 48px; font-size: 1.5rem; margin: 0 auto 0.75rem auto;">🎓</div>
                <h1 style="font-size: 1.6rem; color: var(--primary);">EduTrack Portal</h1>
                <p style="color: var(--text-muted); font-size: 0.85rem; margin-top: 0.25rem;">
                    Student Attendance &amp; Performance Tracker
                </p>
            </div>

            <!-- Role Switcher Toggle -->
            <div class="role-switch-container">
                <button type="button" class="role-btn active" id="btn-role-teacher" onclick="selectRole('TEACHER')">
                    👨‍🏫 Teacher
                </button>
                <button type="button" class="role-btn" id="btn-role-student" onclick="selectRole('STUDENT')">
                    🎓 Student
                </button>
            </div>

            <!-- Alert messages -->
            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
            <div th:if="${logoutMessage}" class="alert alert-info" th:text="${logoutMessage}"></div>
            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

            <form th:action="@{/login}" method="post">
                <div class="form-group">
                    <label class="form-label" id="username-label">Teacher Email Address</label>
                    <input type="text" id="username-input" name="username" class="form-control" 
                           placeholder="teacher@college.edu" required autofocus>
                    <small id="username-hint" style="color: var(--text-muted); font-size: 0.8rem; display:block; margin-top:4px;">
                        Enter your registered institutional faculty email.
                    </small>
                </div>

                <div class="form-group">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
                        <label class="form-label" style="margin-bottom:0;">Password</label>
                    </div>
                    <div style="display:flex; gap:0.5rem;">
                        <input type="password" id="login-password" name="password" class="form-control" placeholder="Enter password" required>
                        <button type="button" class="btn btn-outline btn-sm" onclick="togglePasswordVisibility('login-password', this)">👁️ Show</button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem; font-size: 0.95rem; margin-top: 0.5rem;">
                    Sign In
                </button>
            </form>

            <div style="margin-top: 1.5rem; text-align: center; border-top: 1px solid var(--border-color); padding-top: 1rem; display:flex; justify-content:center; gap:1.25rem;">
                <a th:href="@{/sdg4}" style="font-size: 0.85rem; color: var(--secondary);">🌍 UN SDG 4 Info</a>
                <span style="color:var(--border-color);">|</span>
                <a th:href="@{/about}" style="font-size: 0.85rem; color: var(--text-muted);">ℹ️ About Project</a>
            </div>
        </div>

        <div style="text-align: center; margin-top: 1rem; color: #94a3b8; font-size: 0.8rem;">
            Shah &amp; Anchor Kutchhi Engineering College &bull; Microproject
        </div>
    </div>

    <script th:src="@{/js/main.js}"></script>
    <script>
        function selectRole(role) {
            const btnTeacher = document.getElementById('btn-role-teacher');
            const btnStudent = document.getElementById('btn-role-student');
            const label = document.getElementById('username-label');
            const input = document.getElementById('username-input');
            const hint = document.getElementById('username-hint');

            if (role === 'TEACHER') {
                btnTeacher.classList.add('active');
                btnStudent.classList.remove('active');
                label.textContent = 'Teacher Email Address';
                input.placeholder = 'teacher@college.edu';
                hint.textContent = 'Enter your registered institutional faculty email.';
            } else {
                btnStudent.classList.add('active');
                btnTeacher.classList.remove('active');
                label.textContent = 'Student Roll Number';
                input.placeholder = 'e.g. 101 or 2024CS01';
                hint.textContent = 'Enter your roll number provided by your faculty.';
            }
            input.focus();
        }
    </script>
</body>
</html>
